<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;400;500&family=Cairo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{
  --gold:#c9a84c;--gold-lt:#e8c97a;--ink:#0a0a08;
  --slate:#1e1e1c;--muted:#7a7870;
  --sans:'DM Sans',sans-serif;--serif:'DM Serif Display',serif;
  --arabic:'Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:var(--sans)}

body{
  background:linear-gradient(160deg,#0d2030 0%,#0a0a08 50%,#1a1208 100%);
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:32px 16px 60px;
  position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;
}

/* Loading */
.loading{
  position:fixed;inset:0;background:#0a0a08;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;transition:opacity .5s;
}
.loading.hide{opacity:0;pointer-events:none}
.loading-logo{font-family:var(--serif);font-size:32px;color:#fff;margin-bottom:24px}
.loading-logo em{color:var(--gold);font-style:italic}
.loading-spinner{width:32px;height:32px;border:2px solid rgba(201,168,76,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error-screen{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:80vh;text-align:center;position:relative;z-index:1;
}
.error-screen.show{display:flex}
.error-icon{font-size:48px;margin-bottom:16px}
.error-title{font-family:var(--serif);font-size:28px;color:#fff;margin-bottom:8px}
.error-sub{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:24px;line-height:1.7}
.error-btn{
  padding:12px 28px;background:var(--gold);color:var(--ink);
  border:none;border-radius:40px;font-size:14px;font-weight:500;
  cursor:pointer;text-decoration:none;display:inline-block;
}

/* Card */
.card{
  width:100%;max-width:400px;
  background:#1e1e1c;
  border-radius:24px;overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  position:relative;z-index:1;
  animation:cardIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Card header */
.card-header{
  padding:36px 24px 24px;text-align:center;
  position:relative;overflow:hidden;
  transition:background .3s;
}
.card-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.15) 0%,transparent 70%);
}

/* Lang toggle */
.lang-toggle{
  position:absolute;top:14px;right:14px;
  display:flex;border:1px solid rgba(255,255,255,.12);
  border-radius:20px;overflow:hidden;z-index:2;
}
[dir="rtl"] .lang-toggle{right:auto;left:14px}
.lang-btn{
  padding:4px 12px;font-size:10px;font-weight:500;
  background:transparent;border:none;cursor:pointer;
  color:rgba(255,255,255,.4);transition:all .2s;
}
.lang-btn.active{background:var(--gold);color:var(--ink)}
.lang-btn.ar-btn{font-family:var(--arabic)}

/* Avatar */
.avatar{
  width:84px;height:84px;border-radius:50%;
  margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:500;
  border:3px solid rgba(201,168,76,.4);
  color:var(--gold);position:relative;z-index:1;
  font-family:var(--serif);
  background:rgba(201,168,76,.1);
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}

.card-name{font-size:22px;font-weight:500;color:#fff;margin-bottom:4px;position:relative;z-index:1}
.card-title{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:3px;position:relative;z-index:1}
.card-company{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:10px;position:relative;z-index:1}
.card-bio{
  font-size:13px;color:rgba(255,255,255,.4);
  line-height:1.7;font-weight:300;position:relative;z-index:1;
  max-width:300px;margin:0 auto;
}
[dir="rtl"] .card-name,[dir="rtl"] .card-title,[dir="rtl"] .card-company,[dir="rtl"] .card-bio{
  font-family:var(--arabic);line-height:1.9;
}

/* Links */
.card-links{padding:20px 20px 0}
.card-link{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;margin-bottom:8px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;text-decoration:none;
  transition:all .2s;cursor:pointer;
}
.card-link:hover{background:rgba(255,255,255,.08);border-color:rgba(201,168,76,.3);transform:translateX(3px)}
[dir="rtl"] .card-link{flex-direction:row-reverse}
[dir="rtl"] .card-link:hover{transform:translateX(-3px)}
.link-icon{
  width:38px;height:38px;border-radius:10px;
  background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--gold);flex-shrink:0;
}
.link-info{flex:1;min-width:0}
.link-label{font-size:10px;color:rgba(255,255,255,.35);display:block;margin-bottom:1px}
.link-val{font-size:13px;color:rgba(255,255,255,.8);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[dir="rtl"] .link-label,[dir="rtl"] .link-val{font-family:var(--arabic);text-align:right}
.link-arrow{font-size:16px;color:rgba(255,255,255,.2);flex-shrink:0}
[dir="rtl"] .link-arrow{transform:scaleX(-1)}

/* Actions */
.card-actions{padding:16px 20px;display:flex;gap:8px}
[dir="rtl"] .card-actions{flex-direction:row-reverse}
.btn-save{
  flex:1;padding:13px 0;
  background:var(--gold);color:var(--ink);
  border:none;border-radius:40px;
  font-size:13px;font-weight:500;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-save:hover{background:var(--gold-lt,#e8c97a);transform:translateY(-1px)}
.btn-share{
  flex:1;padding:13px 0;
  background:transparent;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.12);
  border-radius:40px;font-size:13px;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-share:hover{border-color:rgba(255,255,255,.3)}
[dir="rtl"] .btn-save,[dir="rtl"] .btn-share{flex-direction:row-reverse;font-family:var(--arabic)}

.btn-wa{
  margin:0 20px 12px;width:calc(100% - 40px);
  padding:13px;background:#25D366;color:#fff;
  border:none;border-radius:40px;
  font-size:13px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.btn-wa:hover{background:#1da851;transform:translateY(-1px)}
[dir="rtl"] .btn-wa{flex-direction:row-reverse;font-family:var(--arabic)}

/* Lead form */
.lead-form{
  margin:0 20px 16px;padding:18px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
}
.lead-title{
  font-size:13px;color:rgba(255,255,255,.45);
  text-align:center;margin-bottom:14px;line-height:1.5;
}
[dir="rtl"] .lead-title{font-family:var(--arabic)}
.lead-row{display:flex;gap:8px;margin-bottom:8px}
.lead-input{
  flex:1;padding:10px 12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;font-size:12px;color:#fff;
  font-family:var(--sans);transition:border-color .2s;outline:none;
}
.lead-input:focus{border-color:var(--gold)}
[dir="rtl"] .lead-input{font-family:var(--arabic);direction:rtl}
.lead-submit{
  width:100%;padding:11px;border:none;
  border-radius:10px;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s;
  background:var(--gold);color:var(--ink);
}
.lead-submit:hover{background:var(--gold-lt,#e8c97a)}
.lead-success{
  text-align:center;font-size:13px;
  color:rgba(255,255,255,.6);padding:8px 0;display:none;
}
[dir="rtl"] .lead-success{font-family:var(--arabic)}

/* QR + footer */
.card-footer{
  padding:16px 20px 20px;
  border-top:1px solid rgba(255,255,255,.05);
  text-align:center;
}
.qr-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;cursor:pointer}
.qr-box{
  width:52px;height:52px;background:#fff;
  border-radius:10px;padding:4px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s;
}
.qr-box:hover{transform:scale(1.05)}
.qr-box canvas{width:100%!important;height:100%!important}
.qr-text{text-align:left}
[dir="rtl"] .qr-text{text-align:right}
.qr-text-main{font-size:11px;color:rgba(255,255,255,.5);display:block;margin-bottom:2px}
.qr-text-url{font-size:12px;color:var(--gold);font-weight:500}
.footer-link{font-size:11px;color:rgba(255,255,255,.2);text-decoration:none;transition:color .2s}
.footer-link:hover{color:var(--gold)}

/* QR Modal */
.qr-modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.8);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.qr-modal.open{opacity:1;pointer-events:all}
.qr-modal-box{
  background:#1e1e1c;border-radius:20px;padding:32px;
  text-align:center;max-width:300px;width:100%;
  border:1px solid rgba(255,255,255,.08);
  transform:scale(.9);transition:transform .3s;
}
.qr-modal.open .qr-modal-box{transform:scale(1)}
.qr-modal-title{font-family:var(--serif);font-size:20px;color:#fff;margin-bottom:6px}
.qr-modal-sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:20px}
.qr-modal-canvas{background:#fff;border-radius:12px;padding:12px;margin:0 auto 20px;display:inline-block}
.qr-download{
  width:100%;padding:11px;background:var(--gold);color:var(--ink);
  border:none;border-radius:40px;font-size:13px;font-weight:500;cursor:pointer;
  margin-bottom:8px;transition:all .2s;
}
.qr-download:hover{background:var(--gold-lt,#e8c97a)}
.qr-close{
  width:100%;padding:10px;background:transparent;
  color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1);
  border-radius:40px;font-size:13px;cursor:pointer;transition:all .2s;
}
.qr-close:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.7)}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--ink);color:#fff;
  padding:12px 24px;border-radius:40px;
  font-size:13px;font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.1);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index:9999;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  body{padding:20px 12px 48px}
  .card{border-radius:20px}
  .card-header{padding:28px 18px 18px}
  .avatar{width:70px;height:70px;font-size:22px}
  .card-name{font-size:19px}
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="loading-logo">card<em>.io</em></div>
  <div class="loading-spinner"></div>
</div>

<!-- Error -->
<div class="error-screen" id="error-screen">
  <div class="error-icon">🔍</div>
  <div class="error-title" id="error-title">Card not found</div>
  <div class="error-sub" id="error-sub">This card doesn't exist or has been removed.</div>
  <a href="cardio-auth.html" class="error-btn">Create your free card →</a>
</div>

<!-- Card -->
<div class="card" id="card" style="display:none">
  <div class="card-header" id="card-header">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn ar-btn" id="btn-ar" onclick="setLang('ar')">ع</button>
    </div>
    <div class="avatar" id="card-avatar"></div>
    <div class="card-name" id="card-name"></div>
    <div class="card-title" id="card-title"></div>
    <div class="card-company" id="card-company"></div>
    <div class="card-bio" id="card-bio"></div>
  </div>

  <div class="card-links" id="card-links"></div>

  <div class="card-actions">
    <button class="btn-save" onclick="saveContact()">
      <i class="ti ti-address-book"></i>
      <span id="save-label">Save contact</span>
    </button>
    <button class="btn-share" onclick="shareCard()">
      <i class="ti ti-share"></i>
      <span id="share-label">Share</span>
    </button>
  </div>

  <button class="btn-wa" onclick="whatsappShare()">
    <i class="ti ti-brand-whatsapp"></i>
    <span id="wa-label">Share on WhatsApp</span>
  </button>

  <div class="lead-form" id="lead-form">
    <div class="lead-title" id="lead-title">👋 Want to connect? Leave your details</div>
    <div class="lead-row">
      <input class="lead-input" id="lead-name" placeholder="Your name">
      <input class="lead-input" id="lead-email" placeholder="Your email" type="email">
    </div>
    <button class="lead-submit" onclick="submitLead()" id="lead-btn">
      <span id="lead-btn-label">Connect →</span>
    </button>
    <div class="lead-success" id="lead-success"></div>
  </div>

  <div class="card-footer">
    <div class="qr-row" onclick="openQR()">
      <div class="qr-box"><canvas id="qr-small"></canvas></div>
      <div class="qr-text">
        <span class="qr-text-main" id="qr-text-main">Scan to open this card</span>
        <span class="qr-text-url" id="qr-url-display"></span>
      </div>
    </div>
    <a href="cardio-auth.html" class="footer-link" id="footer-link">
      Powered by card.io — Create yours free
    </a>
  </div>
</div>

<!-- QR Modal -->
<div class="qr-modal" id="qr-modal" onclick="closeQROnBg(event)">
  <div class="qr-modal-box">
    <div class="qr-modal-title" id="qr-modal-title">Your QR Code</div>
    <div class="qr-modal-sub" id="qr-modal-sub">Screenshot or download to share</div>
    <div class="qr-modal-canvas"><canvas id="qr-large"></canvas></div>
    <button class="qr-download" onclick="downloadQR()" id="qr-download-btn">Download QR code</button>
    <button class="qr-close" onclick="closeQR()" id="qr-close-btn">Close</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SUPABASE_URL = 'https://gfqhweetningrqycnsab.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmcWh3ZWV0bmluZ3JxeWNuc2FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjcyMzAsImV4cCI6MjA5NDU0MzIzMH0.WRLKO7yVmVzq9NHMNaK-ac7kdoPek2t6ENajKugB4mY';

let sb, cardData, cardLinks, currentLang = 'en', currentSlug = '';

const LINK_ICONS = {
  email:'ti-mail',phone:'ti-phone',whatsapp:'ti-brand-whatsapp',
  website:'ti-world',linkedin:'ti-brand-linkedin',
  instagram:'ti-brand-instagram',twitter:'ti-brand-x',
  youtube:'ti-brand-youtube',github:'ti-brand-github',
  calendar:'ti-calendar'
};

const LINK_LABELS = {
  en:{email:'Email',phone:'Phone',whatsapp:'WhatsApp',website:'Website',
      linkedin:'LinkedIn',instagram:'Instagram',twitter:'X / Twitter',
      youtube:'YouTube',github:'GitHub',calendar:'Book a meeting'},
  ar:{email:'البريد الإلكتروني',phone:'الهاتف',whatsapp:'واتساب',
      website:'الموقع',linkedin:'لينكدإن',instagram:'انستغرام',
      twitter:'إكس / تويتر',youtube:'يوتيوب',github:'جيتهاب',calendar:'احجز اجتماعاً'}
};

const T = {
  en:{save:'Save contact',share:'Share',wa:'Share on WhatsApp',
      leadTitle:'👋 Want to connect? Leave your details',
      leadBtn:'Connect →',leadSuccess:'Thanks! We\'ll be in touch ✓',
      qrScan:'Scan to open this card',qrDownload:'Download QR code',
      qrClose:'Close',qrTitle:'Your QR Code',qrSub:'Screenshot or download to share',
      footerLink:'Powered by card.io — Create yours free',
      errorTitle:'Card not found',errorSub:'This card doesn\'t exist or has been removed.'},
  ar:{save:'حفظ جهة الاتصال',share:'مشاركة',wa:'مشاركة عبر واتساب',
      leadTitle:'👋 هل تريد التواصل؟ اترك بياناتك',
      leadBtn:'← تواصل',leadSuccess:'شكراً! سنتواصل معك ✓',
      qrScan:'امسح للفتح',qrDownload:'تحميل رمز QR',
      qrClose:'إغلاق',qrTitle:'رمز QR الخاص بك',qrSub:'التقط صورة أو حمّل للمشاركة',
      footerLink:'مدعوم من card.io — أنشئ بطاقتك مجاناً',
      errorTitle:'البطاقة غير موجودة',errorSub:'هذه البطاقة غير موجودة أو تمت إزالتها.'}
};

// ── INIT ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  // Get slug from URL: card.html?slug=Chams
  const params = new URLSearchParams(window.location.search);
  currentSlug = params.get('slug') || '';

  if (!currentSlug) {
    showError('No card specified', 'Please provide a card slug in the URL: card.html?slug=yourname');
    return;
  }

  // Init Supabase
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch(e) {
    showError('Connection error', 'Could not connect to the database.');
    return;
  }

  // Load card
  await loadCard();
});

// ── LOAD CARD ────────────────────────────────────────────────
async function loadCard() {
  try {
    const { data: card, error } = await sb
      .from('cards')
      .select('*, card_links(*)')
      .eq('slug', currentSlug)
      .eq('is_published', true)
      .single();

    if (error || !card) {
      showError(T['en'].errorTitle, T['en'].errorSub);
      return;
    }

    cardData = card;
    cardLinks = (card.card_links || []).sort((a,b) => a.sort_order - b.sort_order);

    // Update page title and meta
    const name = card.name_en || card.name_ar || 'Digital Card';
    document.title = `${name} — card.io`;

    // Track view
    trackView(card.id);

    // Render card
    renderCard();
    generateQR();

    // Show card
    document.getElementById('loading').classList.add('hide');
    document.getElementById('card').style.display = 'block';

  } catch(e) {
    console.error('Load error:', e);
    showError('Error loading card', e.message);
  }
}

// ── RENDER ───────────────────────────────────────────────────
function renderCard() {
  const lang = currentLang;
  const isAR = lang === 'ar';
  const t = T[lang];
  const card = cardData;

  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', isAR ? 'rtl' : 'ltr');

  // Theme color
  const THEMES = [
    'linear-gradient(145deg,#1c3d6e,#0d2a50)',
    'linear-gradient(145deg,#3d2a0a,#1a1208)',
    'linear-gradient(145deg,#1a3a0f,#0f2208)',
    'linear-gradient(145deg,#2a1a5e,#16093a)',
    'linear-gradient(145deg,#4a1a08,#280e04)',
    'linear-gradient(145deg,#4a0f25,#280814)',
  ];
  const theme = THEMES[card.theme_index || 0];
  document.getElementById('card-header').style.background = theme;

  // Avatar
  const name = (isAR ? card.name_ar : card.name_en) || card.name_en || card.name_ar || '';
  const initials = name.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase() || '?';
  document.getElementById('card-avatar').textContent = initials;

  // Text fields
  const set = (id, val, ar) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = val || '';
    el.style.fontFamily = ar ? "'Cairo', sans-serif" : '';
    el.style.direction = ar ? 'rtl' : 'ltr';
    el.style.display = val ? 'block' : 'none';
  };

  const title = (isAR ? card.title_ar : card.title_en) || card.title_en || '';
  const company = (isAR ? card.company_ar : card.company_en) || card.company_en || '';
  const bio = (isAR ? card.bio_ar : card.bio_en) || card.bio_en || '';
  const location = card.location || '';

  set('card-name', name, isAR);
  set('card-title', title, isAR);
  set('card-company', [company, location].filter(Boolean).join(' · '), isAR);
  set('card-bio', bio, isAR);

  // Links
  const linksEl = document.getElementById('card-links');
  linksEl.innerHTML = cardLinks.filter(l => l.value).map(l => {
    const icon = LINK_ICONS[l.type] || 'ti-link';
    const label = LINK_LABELS[lang][l.type] || l.type;
    return `<div class="card-link" onclick="handleLink('${l.type}','${l.value}')">
      <div class="link-icon"><i class="ti ${icon}"></i></div>
      <div class="link-info">
        <span class="link-label" style="${isAR?'font-family:Cairo,sans-serif':''}; text-align:${isAR?'right':'left'}">${label}</span>
        <span class="link-val" dir="ltr" style="text-align:${isAR?'right':'left'}">${l.value}</span>
      </div>
      <i class="ti ti-chevron-right link-arrow"></i>
    </div>`;
  }).join('');

  // Buttons
  document.getElementById('save-label').textContent = t.save;
  document.getElementById('share-label').textContent = t.share;
  document.getElementById('wa-label').textContent = t.wa;
  document.getElementById('lead-title').textContent = t.leadTitle;
  document.getElementById('lead-btn-label').textContent = t.leadBtn;
  document.getElementById('qr-text-main').textContent = t.qrScan;
  document.getElementById('qr-download-btn').textContent = t.qrDownload;
  document.getElementById('qr-close-btn').textContent = t.qrClose;
  document.getElementById('qr-modal-title').textContent = t.qrTitle;
  document.getElementById('qr-modal-sub').textContent = t.qrSub;
  document.getElementById('footer-link').textContent = t.footerLink;

  // URL display
  const cardUrl = `${window.location.origin}/card.html?slug=${currentSlug}`;
  document.getElementById('qr-url-display').textContent = `card.io/${currentSlug}`;

  // Lang buttons
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');

  // Lead placeholders
  document.getElementById('lead-name').placeholder = isAR ? 'اسمك' : 'Your name';
  document.getElementById('lead-email').placeholder = isAR ? 'بريدك الإلكتروني' : 'Your email';
}

// ── ACTIONS ──────────────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  renderCard();
  generateQR();
}

function handleLink(type, val) {
  if (type === 'email') window.open(`mailto:${val}`);
  else if (type === 'phone') window.open(`tel:${val}`);
  else if (type === 'whatsapp') window.open(`https://wa.me/${val.replace(/\D/g,'')}`);
  else if (type === 'linkedin') window.open(`https://linkedin.com/${val}`);
  else if (type === 'instagram') window.open(`https://instagram.com/${val.replace('@','')}`);
  else if (type === 'twitter') window.open(`https://x.com/${val.replace('@','')}`);
  else if (type === 'youtube') window.open(`https://youtube.com/${val}`);
  else if (type === 'github') window.open(`https://github.com/${val}`);
  else if (type === 'calendar') window.open(val.startsWith('http') ? val : `https://${val}`);
  else if (type === 'website') window.open(val.startsWith('http') ? val : `https://${val}`);
}

function saveContact() {
  const card = cardData;
  const name = card.name_en || card.name_ar || '';
  const phone = cardLinks.find(l=>l.type==='phone')?.value || '';
  const email = cardLinks.find(l=>l.type==='email')?.value || '';
  const website = cardLinks.find(l=>l.type==='website')?.value || '';
  const wa = cardLinks.find(l=>l.type==='whatsapp')?.value || '';
  const vcf = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL;TYPE=CELL:${phone||wa}\nEMAIL:${email}\nURL:${website}\nNOTE:card.io/${currentSlug}\nEND:VCARD`;
  const blob = new Blob([vcf], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${name.replace(/\s/g,'_')}.vcf`;
  a.click(); URL.revokeObjectURL(url);
  showToast(currentLang==='ar' ? 'تم حفظ جهة الاتصال ✓' : 'Contact saved! ✓');
}

function shareCard() {
  const url = `${window.location.origin}/card.html?slug=${currentSlug}`;
  if (navigator.share) {
    navigator.share({ title: cardData.name_en || 'Digital Card', url });
  } else {
    navigator.clipboard.writeText(url);
    showToast(currentLang==='ar' ? 'تم نسخ الرابط ✓' : 'Link copied! ✓');
  }
}

function whatsappShare() {
  const url = `${window.location.origin}/card.html?slug=${currentSlug}`;
  const name = cardData.name_en || cardData.name_ar || '';
  const msg = currentLang==='ar'
    ? `بطاقة ${name} الرقمية: ${url}`
    : `${name}'s digital card: ${url}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

async function submitLead() {
  const name = document.getElementById('lead-name').value.trim();
  const email = document.getElementById('lead-email').value.trim();
  const t = T[currentLang];
  if (!name || !email) { showToast(currentLang==='ar' ? 'يرجى ملء جميع الحقول' : 'Please fill all fields'); return; }

  const btn = document.getElementById('lead-btn');
  if (btn) btn.disabled = true;

  try {
    if (sb && cardData) {
      await sb.from('leads').insert({
        card_id: cardData.id,
        visitor_name: name,
        visitor_email: email
      });
    }
    document.getElementById('lead-name').value = '';
    document.getElementById('lead-email').value = '';
    document.getElementById('lead-success').textContent = t.leadSuccess;
    document.getElementById('lead-success').style.display = 'block';
    document.getElementById('lead-btn').style.display = 'none';
    showToast(t.leadSuccess);
  } catch(e) {
    showToast('Error: ' + e.message);
    if (btn) btn.disabled = false;
  }
}

// ── QR CODE ──────────────────────────────────────────────────
function generateQR() {
  const url = `${window.location.origin}/card.html?slug=${currentSlug}`;
  const opts = { width: 180, margin: 0, color: { dark:'#000000', light:'#ffffff' } };

  QRCode.toCanvas(document.getElementById('qr-small'), url, { width: 44, margin: 0, color: { dark:'#000000', light:'#ffffff' } }, () => {});
  QRCode.toCanvas(document.getElementById('qr-large'), url, opts, () => {});
}

function openQR() { document.getElementById('qr-modal').classList.add('open'); }
function closeQR() { document.getElementById('qr-modal').classList.remove('open'); }
function closeQROnBg(e) { if (e.target === document.getElementById('qr-modal')) closeQR(); }

function downloadQR() {
  const canvas = document.getElementById('qr-large');
  const a = document.createElement('a');
  a.download = `card-io-${currentSlug}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast(currentLang==='ar' ? 'تم تحميل رمز QR ✓' : 'QR code downloaded! ✓');
}

// ── ANALYTICS ────────────────────────────────────────────────
async function trackView(cardId) {
  if (!sb || !cardId) return;
  try {
    const device = /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    await sb.from('card_views').insert({ card_id: cardId, device });
  } catch(e) {}
}

// ── HELPERS ──────────────────────────────────────────────────
function showError(title, sub) {
  document.getElementById('loading').classList.add('hide');
  const err = document.getElementById('error-screen');
  err.classList.add('show');
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-sub').textContent = sub;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Expose onclick functions
window.setLang = setLang;
window.saveContact = saveContact;
window.shareCard = shareCard;
window.whatsappShare = whatsappShare;
window.submitLead = submitLead;
window.openQR = openQR;
window.closeQR = closeQR;
window.closeQROnBg = closeQROnBg;
window.downloadQR = downloadQR;
window.handleLink = handleLink;
</script>
</body>
</html>
